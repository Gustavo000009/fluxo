<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluxo · Organize seu dinheiro</title>
  <meta name="theme-color" content="#f5f7f4">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="/img/carteira-verde.png?v=2">
  <script>
// Executado antes do CSS para aplicar a preferência sem piscar o tema errado.
(() => {
  const chave = 'fluxo-tema';
  const sistema = window.matchMedia('(prefers-color-scheme: dark)');
  let preferencia = null;
  try {
    const salva = localStorage.getItem(chave);
    if (salva === 'light' || salva === 'dark') preferencia = salva;
  } catch (_) { /* O tema também funciona com armazenamento bloqueado. */ }

  function aplicar(tema) {
    document.documentElement.dataset.theme = tema;
    document.documentElement.style.colorScheme = tema;
    const escuro = tema === 'dark';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = escuro ? '#0c1421' : '#f5f7f4';
    const botao = document.getElementById('themeToggle');
    if (botao) {
      botao.setAttribute('aria-label', escuro ? 'Ativar modo claro' : 'Ativar modo escuro');
      botao.title = escuro ? 'Ativar modo claro' : 'Ativar modo escuro';
      botao.querySelector('[data-theme-icon]').textContent = escuro ? '☀️' : '🌙';

    }
    document.dispatchEvent(new CustomEvent('fluxo:tema', { detail: { tema } }));
  }

  aplicar(preferencia || (sistema.matches ? 'dark' : 'light'));
  document.addEventListener('click', e => {
    if (!e.target.closest?.('#themeToggle')) return;
    preferencia = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(chave, preferencia); } catch (_) { /* Mantém nesta sessão. */ }
    aplicar(preferencia);
  });
  document.addEventListener('DOMContentLoaded', () => aplicar(document.documentElement.dataset.theme));
  document.addEventListener('fluxo:botao-pronto', () => aplicar(document.documentElement.dataset.theme));
  sistema.addEventListener('change', e => {
    if (!preferencia) aplicar(e.matches ? 'dark' : 'light');
  });
  window.addEventListener('storage', e => {
    if (e.key !== chave && e.key !== null) return;
    preferencia = e.newValue === 'light' || e.newValue === 'dark' ? e.newValue : null;
    aplicar(preferencia || (sistema.matches ? 'dark' : 'light'));
  });
})();

</script>
