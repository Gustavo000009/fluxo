server.servlet.session.timeout=24h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
server.servlet.session.cookie.max-age=24h

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Configure o SMTP e estas variáveis somente no ambiente do servidor.
app.email.remetente=${FLUXO_EMAIL_REMETENTE:}
app.url-publica=${FLUXO_URL_PUBLICA:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Só habilite após publicar o Fluxo em HTTPS e validar a conta recebedora.
app.infinitepay.handle=${FLUXO_INFINITEPAY_HANDLE:fluxofinancas}
app.infinitepay.habilitado=${FLUXO_INFINITEPAY_HABILITADO:false}

# Configuração privada local, fora do pacote e do código compartilhado.
spring.config.import=optional:file:./config/fluxo-proprietario.properties
